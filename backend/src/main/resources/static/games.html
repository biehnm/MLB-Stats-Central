
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MLB Stats Central - Games</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>

<header>
    <h1>MLB Stats Central</h1>
    <p>2026 Season Tracker</p>

    <nav>
        <a href="/">Players</a>
        <a href="/teams.html">Teams</a>
        <a href="/games.html">Games</a>
    </nav>
</header>

<main>
    <section class="welcome">
        <h2>Game Schedule</h2>
        <p>View game results and schedules from our mock database.</p>
    </section>

    <section class="players-section">
        <h2>All Games</h2>

        <p id="game-count">Loading games...</p>

        <div class="table-container">
            <table>
                <thead>
                <tr>
                    <th>Game ID</th>
                    <th>Date</th>
                    <th>Home Team</th>
                    <th>Away Team</th>
                    <th>Score</th>
                    <th>Status</th>
                </tr>
                </thead>
                <tbody id="games-table">
                <tr>
                    <td colspan="6">Loading games...</td>
                </tr>
                </tbody>
            </table>
        </div>

        <p id="error-message"></p>
    </section>
</main>

<footer>
    <p>MLB Stats Central | Software Engineering Project</p>
</footer>

<script src="games.js"></script>
</body>
</html>
